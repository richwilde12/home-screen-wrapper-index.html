<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WakeFlix</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WakeFlix">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #0F0F0F; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- Replace AKfycbylZdGwfx5mdIPfuRa37BVgr7Qlc_ZOtlqSRfN5xPjXeM9OBWRU6Ryn4eZrdC_GbcMpqw with the ID from your Apps Script web app URL -->
<iframe id="app" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
/* This page tells the app who is using it, with no login. Two ways, best first:
   1. A personal link (this address with ?r=code). The home-screen icon keeps the full address, so it works every launch.
   2. A name picked once in the app, kept in THIS page's storage (iPhone keeps it; it wipes the app's own storage).
   Both are passed to the app in its web address, and the server works out the name before the page is built. */
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbylZdGwfx5mdIPfuRa37BVgr7Qlc_ZOtlqSRfN5xPjXeM9OBWRU6Ryn4eZrdC_GbcMpqw/exec', KEY = 'wf_id_v1', s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { s = {}; }
  if (!/^[A-Za-z0-9]{3,40}$/.test(s.d || '')) s.d = 'w' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  // A personal link (…/?r=code) says who this is. The icon keeps that address, and this page keeps the code too.
  var m = /[?&]r=([A-Za-z0-9]{6,20})(?:&|$)/.exec(location.search);
  if (m) s.r = m[1].toLowerCase();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  save();
  var f = document.getElementById('app');
  f.src = BASE + '?wd=' + encodeURIComponent(s.d) + (s.r ? '&r=' + encodeURIComponent(s.r) : '') + (s.n ? '&wn=' + encodeURIComponent(s.n) : '');
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.wf !== 'id' || !/(^https:\/\/script\.google\.com$|\.googleusercontent\.com$)/.test(ev.origin)) return;
    if (typeof d.n === 'string' && d.n && d.n.length <= 40) s.n = d.n;   // the phone id stays as this page made it
    save();
  });
})();
</script>
</body>
</html>
