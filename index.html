<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WakeFlix</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WakeFlix">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #0F0F0F; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- Replace YOUR_DEPLOYMENT_ID with the ID from your Apps Script web app URL -->
<iframe id="app" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
/* This page remembers which phone this is and who is using it. iPhone can clear the app's own storage inside the
   frame, but this page's storage is kept, so it hands the phone id and name to the app in the web address. */
(function () {
  var BASE = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec', KEY = 'wf_id_v1', s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { s = {}; }
  if (!/^[A-Za-z0-9]{3,40}$/.test(s.d || '')) s.d = 'w' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  save();
  var f = document.getElementById('app');
  f.src = BASE + '?wd=' + encodeURIComponent(s.d) + (s.n ? '&wn=' + encodeURIComponent(s.n) : '');
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.wf !== 'id' || !/(^https:\/\/script\.google\.com$|\.googleusercontent\.com$)/.test(ev.origin)) return;
    if (typeof d.n === 'string' && d.n && d.n.length <= 40) s.n = d.n;   // the phone id stays as this page made it
    save();
  });
})();
</script>
</body>
</html>
